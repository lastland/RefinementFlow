name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHON: python3
      CLANG: clang-18
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: ocaml-base-compiler.5.4.1
          opam-repositories: |
            rocq-released: https://rocq-prover.org/opam/released
            default: https://opam.ocaml.org
          cache: true

      - name: Install dependencies
        run: opam install . --deps-only --with-test --yes

      - name: Run checks
        # Hook tests run nested opam commands from temporary repositories.
        run: opam exec --set-switch -- make check

      - name: Upload C check evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: c-check-evidence
          path: |
            build/c/report.json
            build/c/commands.json
            build/c/logs/
          retention-days: 7
          if-no-files-found: ignore
